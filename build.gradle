import java.time.LocalDateTime

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.9'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id "org.sonarqube" version "7.2.0.6526"
    id "com.adarshr.test-logger" version "4.0.0"
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Environment
    implementation "me.paulschwarz:spring-dotenv:4.0.0"

    // Spring Boot starters - EXCLUDE ALL LOGGING
    implementation('org.springframework.boot:spring-boot-starter-data-jpa') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    implementation('org.springframework.boot:spring-boot-starter-security') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    implementation('org.springframework.boot:spring-boot-starter-oauth2-resource-server') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    implementation('org.springframework.boot:spring-boot-starter-validation') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }

    // Database
    implementation 'org.postgresql:postgresql:42.7.8'
    implementation 'org.flywaydb:flyway-core:11.19.1'
    implementation 'org.flywaydb:flyway-database-postgresql:11.19.1'

    // OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'com.github.slugify:slugify:3.0.7'

    // AWS
    implementation 'software.amazon.awssdk:s3:2.41.8'
    implementation 'software.amazon.awssdk:auth:2.41.8'
    implementation 'software.amazon.awssdk:cloudwatchlogs:2.41.13'

    // Lombok - MUST be processed BEFORE MapStruct
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // MapStruct - processes AFTER Lombok
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // JSON Web Tokens
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly('io.jsonwebtoken:jjwt-impl:0.12.6') {
        exclude group: 'org.bouncycastle'
    }
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Validation
    implementation 'jakarta.validation:jakarta.validation-api:4.0.0-M1'

    // Logging — ONLY Log4j2, async, no loops
    implementation 'org.apache.logging.log4j:log4j-api:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-layout-template-json:2.25.3'
    implementation 'com.lmax:disruptor:3.4.4'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    annotationProcessor 'org.apache.logging.log4j:log4j-core:2.25.3'

    // AWS CloudWatch - for custom appender
    implementation 'software.amazon.awssdk:cloudwatchlogs:2.41.13'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Testing
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:3.27.6"
    testImplementation "org.testcontainers:junit-jupiter"
    testImplementation "org.testcontainers:postgresql"
}

configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'

    resolutionStrategy {
        force 'org.apache.commons:commons-lang3:3.18.0'
        force 'org.apache.logging.log4j:log4j-api:2.25.3'
        force 'org.apache.logging.log4j:log4j-core:2.25.3'
        force 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.3'
    }
}

jacoco {
    toolVersion = "0.8.11"
}

test {
    outputs.upToDateWhen { false }
    useJUnitPlatform()
}

sonarqube {
    properties {
        property "sonar.coverage.exclusions", [
                "**/Application.java",
                "**/config/**",
                "**/dto/**",
                "**/entity/**",
                "**/**Docs**",
                "**/logging/**"
        ].join(",")

        property "sonar.issue.ignore.multicriteria", "e1,e2"

        // Disable S2629 (Invoke method(s) only conditionally)
        property "sonar.issue.ignore.multicriteria.e1.ruleKey", "java:S2629"
        property "sonar.issue.ignore.multicriteria.e1.resourceKey", "**/*.java"

        // Disable S2139 (Exceptions should be either logged or rethrown but not both)
        property "sonar.issue.ignore.multicriteria.e2.ruleKey", "java:S2139"
        property "sonar.issue.ignore.multicriteria.e2.resourceKey", "**/*.java"
    }
}

//test {
//    useJUnitPlatform()
//    finalizedBy jacocoTestReport
//
//    testLogging {
//        events "passed", "skipped", "failed"
//        exceptionFormat "full"
//        showStandardStreams = true
//    }
//}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

javadoc {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        author = true
        version = true
        links(
                'https://docs.oracle.com/en/java/javase/21/docs/api/',
                'https://docs.spring.io/spring-framework/docs/current/javadoc-api/'
        )
        addStringOption('Xdoclint:none', '-quiet')
    }
    destinationDir = file("docs/javadoc")
    title = "Blog Application API - JavaDoc"
}

task generateOpenApiHtml(type: Exec) {
    group = 'documentation'
    description = 'Generates OpenAPI HTML documentation using Redocly'

    doFirst {
        file("docs/openapi").mkdirs()
    }

    commandLine 'npx', '@redocly/cli', 'build-docs',
            'http://localhost:8080/v3/api-docs',
            '-o', 'docs/openapi/api-documentation.html'

    doLast {
        println "OpenAPI HTML generated at: docs/openapi/api-documentation.html"
    }
}

task generateAllDocs {
    group = 'documentation'
    description = 'Generates all documentation (JavaDoc + OpenAPI)'

    dependsOn javadoc
    dependsOn generateOpenApiHtml

    doLast {
        println """
        ========================================
        Documentation Generated Successfully!
        ========================================
        
        JavaDoc HTML:
          docs/javadoc/index.html
        
        OpenAPI HTML:
          docs/openapi/api-documentation.html
          
        ========================================
        """.stripIndent()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    def now = LocalDateTime.now().toString().replace(":", "-").replace(".", "-")

    systemProperty 'spring.devtools.restart.enabled', 'false'
    systemProperty 'log4j2.contextSelector',
            'org.apache.logging.log4j.core.async.AsyncLoggerContextSelector'
    systemProperty 'CLOUDWATCH_LOG_GROUP', '/blogs-app-local'
    systemProperty 'LOG_STREAM_NAME', "local-${now}"
    systemProperty 'AWS_REGION', 'eu-central-1'
    systemProperty 'AWS_CLOUDWATCH_ENDPOINT', 'http://localhost:4566'
    systemProperty 'AWS_ACCESS_KEY_ID', 'test'
    systemProperty 'AWS_SECRET_ACCESS_KEY', 'test'
    systemProperty 'log4j2.configurationFile', 'classpath:log4j2-local.xml'
    systemProperty 'spring.profiles.active', 'local'
}


configurations.all {
    resolutionStrategy {
        force 'org.apache.logging.log4j:log4j-api:2.25.3'
        force 'org.apache.logging.log4j:log4j-core:2.25.3'
        force 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.3'
    }
}