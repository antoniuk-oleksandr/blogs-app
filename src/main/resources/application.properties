# Application Name
spring.application.name=blogs.app

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Location of migration scripts (default)
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Hikari
spring.datasource.hikari.connection-timeout=30000

# JWT
jwt.access-token-expiration=30d
jwt.refresh-token-expiration=30d

# Server
server.port=8080

# Scheduled Tasks
revoked-token-cleaner.cron=0 0 * * * *

# File Upload
spring.servlet.multipart.enabled=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,metrics
management.server.port=8081
management.endpoint.health.probes.enabled=true

# OpenSearch
opensearch.host=${OPENSEARCH_HOST:http://localhost}
opensearch.port=${OPENSEARCH_PORT:9200}
opensearch.username=${OPENSEARCH_USERNAME:}
opensearch.password=${OPENSEARCH_PASSWORD:}

# Search indexing queue
search.indexing.exchange=${SEARCH_INDEXING_EXCHANGE:blogs.search.indexing}
search.indexing.queue=${SEARCH_INDEXING_QUEUE:blogs.search.indexing.posts}
search.indexing.routing-key=${SEARCH_INDEXING_ROUTING_KEY:posts.index}
search.indexing.batch-size=${SEARCH_INDEXING_BATCH_SIZE:20}
